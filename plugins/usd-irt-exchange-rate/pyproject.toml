[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-usd-irt-exchange-rate"
description = "Manual and TGJU-provided USD to IRT exchange rates for InvenTree"
dynamic = ["version"]
authors = [
    { name = "Nooshin Shadiani" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "lxml>=5",
    "py-moneyed>=3",
    "requests>=2.31",
]
keywords = ["inventree", "plugin", "currency", "iran", "tgju"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.urls]
Homepage = "https://github.com/nooshin-shadiani/inventree-plugins/tree/master/plugins/usd-irt-exchange-rate"
Repository = "https://github.com/nooshin-shadiani/inventree-plugins"
Issues = "https://github.com/nooshin-shadiani/inventree-plugins/issues"

[project.entry-points."inventree_plugins"]
InvenTreeUSDIRTExchangeRate = "inventree_usd_irt_exchange_rate.core:IranianCurrencyExchange"

[project.optional-dependencies]
dev = [
    "pyrefly>=1.2,<2",
]

[tool.setuptools]
py-modules = ["_inventree_usd_irt_build"]

[tool.setuptools.packages.find]
where = [""]
include = ["inventree_usd_irt_exchange_rate*"]

[tool.setuptools.package-data]
inventree_usd_irt_exchange_rate = ["static/*.js"]

[tool.setuptools.data-files]
"" = ["inventree_usd_irt_exchange_rate_bootstrap.pth"]

[tool.setuptools.cmdclass]
install_data = "_inventree_usd_irt_build.InstallDataToPurelib"

[tool.setuptools.dynamic]
version = { attr = "inventree_usd_irt_exchange_rate.PLUGIN_VERSION" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "F", "I", "N", "PIE", "PL", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
python-version = "3.12"
project-includes = ["inventree_usd_irt_exchange_rate", "tests"]
ignore-missing-imports = [
    "common.*",
    "company.*",
    "django.*",
    "djmoney.*",
    "InvenTree.*",
    "order.*",
    "part.*",
    "plugin",
    "plugin.*",
    "rest_framework.*",
    "stock.*",
    "users.*",
]
