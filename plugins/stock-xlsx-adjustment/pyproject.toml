[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-stock-xlsx-adjustment"
description = "Preview and apply logged InvenTree stock adjustments from XLSX files"
dynamic = ["version"]
authors = [
    { name = "Nooshin Shadiani" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
keywords = ["inventree", "plugin", "inventory", "stock", "xlsx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.urls]
Homepage = "https://github.com/nooshin-shadiani/inventree-plugins/tree/main/plugins/stock-xlsx-adjustment"
Repository = "https://github.com/nooshin-shadiani/inventree-plugins"
Issues = "https://github.com/nooshin-shadiani/inventree-plugins/issues"

[project.entry-points."inventree_plugins"]
InvenTreeStockXlsxAdjustment = "inventree_stock_xlsx_adjustment.core:StockXlsxAdjustmentPlugin"

[project.optional-dependencies]
dev = [
    "pyrefly>=1.2,<2",
]

[tool.setuptools.packages.find]
where = [""]
include = ["inventree_stock_xlsx_adjustment*"]

[tool.setuptools.package-data]
inventree_stock_xlsx_adjustment = ["static/*.js"]

[tool.setuptools.dynamic]
version = { attr = "inventree_stock_xlsx_adjustment.PLUGIN_VERSION" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "F", "I", "N", "PIE", "PL", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pyrefly]
python-version = "3.12"
project-includes = ["inventree_stock_xlsx_adjustment"]
ignore-missing-imports = [
    "common.*",
    "django.*",
    "importer.*",
    "InvenTree.*",
    "openpyxl.*",
    "plugin",
    "plugin.*",
    "rest_framework.*",
    "stock.*",
    "tablib",
    "users.*",
]
