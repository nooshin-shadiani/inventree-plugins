[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-usd-irt-exchange-rate"
description = "Manual and TGJU-provided USD to IRR exchange rates for InvenTree"
dynamic = ["version"]
authors = [
    { name = "Nooshin Shadiani" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5",
    "requests>=2.31",
]
keywords = ["inventree", "plugin", "currency", "iran", "tgju"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

[project.urls]
Homepage = "https://github.com/nooshin-shadiani/InventreeUSDIRTExchangeRate"
Repository = "https://github.com/nooshin-shadiani/InventreeUSDIRTExchangeRate"
Issues = "https://github.com/nooshin-shadiani/InventreeUSDIRTExchangeRate/issues"

[project.entry-points."inventree_plugins"]
InvenTreeUSDIRTExchangeRate = "inventree_usd_irt_exchange_rate.core:IranianCurrencyExchange"

[tool.setuptools.packages.find]
where = [""]
include = ["inventree_usd_irt_exchange_rate*"]

[tool.setuptools.dynamic]
version = { attr = "inventree_usd_irt_exchange_rate.PLUGIN_VERSION" }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["A", "B", "C4", "D", "F", "I", "N", "PIE", "PL", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"inventree_usd_irt_exchange_rate/__init__.py" = ["RUF067"]
